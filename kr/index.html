<style>
:root{--bg0:#000;--bg1:#07070d;--bg2:#0d0d16;--bg3:#13131f;--bg4:#1a1a2a;--bdr:#1a1a2e;--bdr2:#282845;--t1:#e8e8f0;--t2:#b0b0c8;--t3:#8888a0;--t4:#686880;--g:#00ff88;--r:#ff4466;--b:#4488ff;--y:#ffcc00;--font-sans:'Noto Sans KR',system-ui,sans-serif;--font-mono:'JetBrains Mono',monospace;--font-head:'Plus Jakarta Sans',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{font-family:var(--font-sans);background:var(--bg0);color:var(--t1);line-height:1.6;min-height:100vh;overflow-x:hidden}
a{color:var(--g);text-decoration:none}::selection{background:var(--b);color:#fff}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg1)}::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px}
.hdr{padding:12px 28px;border-bottom:1px solid var(--bdr);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg1);position:sticky;top:0;z-index:100;backdrop-filter:blur(20px)}
.hdr-title{font-weight:700;font-size:18px;color:#fff;text-align:center}
.hdr-sub{font-size:11px;color:var(--t4);font-family:var(--font-mono);margin-top:4px;text-align:center}
.hdr-sub .hl{color:var(--b)}
.page{max-width:960px;margin:0 auto;padding:20px 28px}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:20px}
.summary-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:16px 18px;text-align:center;transition:border-color .2s}
.summary-card:hover{border-color:var(--bdr2)}
.summary-card .label{font-size:11px;color:var(--t4);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.summary-card .value{font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--t1)}
.summary-card .sub{font-size:11px;color:var(--t3);margin-top:3px;font-family:var(--font-mono)}
.chart-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:11px;overflow:hidden;margin-bottom:20px}
.chart-head{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 20px;border-bottom:1px solid var(--bdr);gap:4px}
.chart-head h3{font-family:var(--font-head);font-size:.875rem;font-weight:600;color:var(--t1);text-align:center}
.chart-area{position:relative;padding:12px 20px;height:280px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.chart-card.full{grid-column:1/-1}
.section-title{font-family:var(--font-head);font-size:.9rem;font-weight:600;color:var(--t1);text-align:center;margin-bottom:14px}
.ratio-bar-wrap{margin-bottom:20px;padding:16px 20px;background:var(--bg2);border:1px solid var(--bdr);border-radius:11px}
.ratio-bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}
.ratio-bar-label .domestic{color:var(--b);font-weight:600}
.ratio-bar-label .foreign{color:#06b6d4;font-weight:600}
.ratio-bar{height:14px;border-radius:7px;overflow:hidden;display:flex;background:var(--bg3)}
.ratio-bar .dom{background:linear-gradient(90deg,#4488ff,#6366f1);border-radius:7px 0 0 7px;transition:width .6s}
.ratio-bar .for{background:linear-gradient(90deg,#06b6d4,#00ff88);border-radius:0 7px 7px 0;transition:width .6s}
.returns-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:20px}
.return-item{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:14px 16px;text-align:center;transition:border-color .2s}
.return-item:hover{border-color:var(--bdr2)}
.return-item .asset-name{font-size:11px;color:var(--t4);margin-bottom:5px}
.return-item .ret-value{font-family:var(--font-mono);font-size:20px;font-weight:600}
.return-item .alpha{font-family:var(--font-mono);font-size:10px;margin-top:3px}
.alpha.pos{color:var(--g)}.alpha.neg{color:var(--r)}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;border:1px solid var(--bdr);border-radius:11px;background:var(--bg2)}
.table-wrap::-webkit-scrollbar{display:none}
table{width:100%;border-collapse:collapse;font-size:.75rem;min-width:650px}
thead th{position:sticky;top:0;background:var(--bg3);color:var(--t4);font-size:.6rem;font-weight:500;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;text-align:left;border-bottom:1px solid var(--bdr);white-space:nowrap}
thead th.right,td.right{text-align:right}
tbody tr{border-bottom:1px solid var(--bdr);transition:background .15s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg3)}
td{padding:7px 10px;white-space:nowrap}
.mono{font-family:var(--font-mono);font-size:.65rem}
.name-cell-kr{font-weight:600;color:var(--t1);font-size:.75rem}
.code-cell{font-family:var(--font-mono);font-size:.6rem;color:var(--t4)}
.sector-badge{display:inline-block;font-size:.55rem;padding:2px 6px;border-radius:3px;font-weight:500}
.pct-bar{display:inline-block;height:5px;border-radius:3px;vertical-align:middle;margin-right:5px;opacity:.8}
.footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--bdr);font-size:.6rem;color:var(--t4);text-align:center;line-height:1.8}
.footer a{color:var(--b);text-decoration:none}.footer a:hover{text-decoration:underline}
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--t3);font-size:13px}
.spinner{width:18px;height:18px;border:2px solid var(--bdr);border-top-color:var(--b);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.share-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;margin-top:28px;background:var(--bg1);border:1px solid var(--bdr);border-radius:10px}
.share-bar-preview{font-size:11px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%;font-family:var(--font-mono)}
.share-bar-preview b{color:var(--t2);font-weight:600}
.share-bar-buttons{display:flex;align-items:center;gap:6px;flex-shrink:0}
.share-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid var(--bdr2);background:var(--bg2);color:var(--t3);white-space:nowrap;font-family:inherit}
.share-btn:hover{transform:translateY(-1px);color:var(--t1)}
.share-btn svg{flex-shrink:0}
.share-btn--x:hover{border-color:#fff;color:#fff;background:var(--bg3)}
.share-btn--kakao:hover{border-color:#FEE500;color:#191919;background:#FEE500}
.share-btn--tg:hover{border-color:#26A5E4;color:#fff;background:rgba(38,165,228,.15)}
.share-btn--ig:hover{border-color:#E4405F;color:#fff;background:rgba(228,64,95,.15)}
.share-btn--copy:hover{border-color:var(--g);color:var(--g);background:rgba(0,255,136,.07)}
.inline-share{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 0;border-top:1px solid var(--bdr)}
.inline-share .lbl{font-size:10px;color:var(--t4);margin-right:4px}
.inline-share .share-btn{padding:6px 10px}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:999}
.toast{background:var(--bg4);border:1px solid var(--bdr2);border-left:3px solid var(--g);border-radius:8px;padding:10px 18px;font-size:12px;color:var(--t1);box-shadow:0 8px 32px rgba(0,0,0,.7);animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:768px){
.page{padding:12px 16px}.hdr{padding:8px 16px}
.charts-grid{grid-template-columns:1fr}
.chart-area{height:240px;padding:10px}
.summary-grid{grid-template-columns:repeat(2,1fr);gap:8px}
.summary-card .value{font-size:18px}
.returns-grid{grid-template-columns:repeat(2,1fr)}
.return-item .ret-value{font-size:16px}
.share-bar{flex-direction:column;gap:10px;align-items:stretch}
.share-bar-preview{max-width:100%}
.share-bar-buttons{justify-content:center;flex-wrap:wrap}
.share-btn .lbl{display:none}.share-btn{padding:8px 10px}
.inline-share .lbl{display:none}
}
@media(max-width:520px){
.page{padding:10px 10px}.chart-area{height:220px;padding:8px}
.code-cell{display:none}
table{font-size:.65rem;min-width:500px}
}

async function init(){
  try{
    var alloc=await loadJSON('asset_allocation.json');
    var holdings=await loadJSON('major_holdings.json');
    render(alloc,holdings);
  }catch(e){
    document.getElementById('app').innerHTML='<div class="loading" style="color:var(--r)">데이터 로드 실패: '+e.message+'</div>';
  }
}

function render(alloc,holdings){
  var app=document.getElementById('app');
  var ret=alloc.returns.ytd;
  var allocKeys=Object.keys(alloc.allocation);

  var sectorMap={};
  holdings.holdings.forEach(function(h){sectorMap[h.sector]=(sectorMap[h.sector]||0)+1;});
  var sectorEntries=Object.entries(sectorMap).sort(function(a,b){return b[1]-a[1];});

  app.innerHTML=
    '<div class="summary-grid">'+
      '<div class="summary-card"><div class="label">총 적립금</div><div class="value">'+fmtT(alloc.total_fund)+'</div><div class="sub">원</div></div>'+
      '<div class="summary-card"><div class="label">국내주식</div><div class="value" style="color:var(--b)">'+fmtT(alloc.allocation.domestic_stock.amount)+'</div><div class="sub">전체 '+fmtPct(alloc.allocation.domestic_stock.weight)+'</div></div>'+

      '<div class="summary-card"><div class="label">누적 운용수익금</div><div class="value" style="color:var(--g)">'+fmtT(alloc.cumulative_return)+'</div><div class="sub">1988년 이후 누적</div></div>'+
    '</div>'+

    '<div class="ratio-bar-wrap">'+
      '<div class="ratio-bar-label"><span class="domestic">국내 '+fmtPct(alloc.domestic_ratio)+'</span><span class="foreign">해외 '+fmtPct(alloc.foreign_ratio)+'</span></div>'+
      '<div class="ratio-bar"><div class="dom" style="width:'+alloc.domestic_ratio+'%"></div><div class="for" style="width:'+alloc.foreign_ratio+'%"></div></div>'+
    '</div>'+

    '<div class="charts-grid">'+
      '<div class="chart-card"><div class="chart-head"><h3>자산배분 현황</h3></div><div class="chart-area"><canvas id="allocChart"></canvas></div><div class="inline-share" id="is1"></div></div>'+
      '<div class="chart-card"><div class="chart-head"><h3>월별 자산배분 추이</h3></div><div class="chart-area"><canvas id="stackedChart"></canvas></div><div class="inline-share" id="is2"></div></div>'+
    '</div>'+

    '<div class="charts-grid">'+
      '<div class="chart-card full"><div class="chart-head"><h3>기금 적립금 성장 추이 (연간)</h3></div><div class="chart-area" style="height:240px"><canvas id="growthChart"></canvas></div><div class="inline-share" id="is3"></div></div>'+
    '</div>'+

    '<div class="section-title">자산군별 수익률 (YTD)</div>'+
    '<div class="returns-grid">'+
    Object.entries(ret).map(function(entry){
      var key=entry[0],r=entry[1];
      var label=ALLOC_LABELS[key]||key;
      var color=r.return>=10?'var(--g)':r.return>=5?'#06b6d4':'var(--b)';
      return'<div class="return-item"><div class="asset-name">'+label+'</div><div class="ret-value" style="color:'+color+'">+'+fmtPct(r.return)+'</div><div class="alpha '+(r.alpha>=0?'pos':'neg')+'">a '+(r.alpha>=0?'+':'')+fmtPct(r.alpha)+' vs BM</div></div>';
    }).join('')+
    '</div>'+

    '<div class="section-title">국내 대량보유 종목 (지분율 5% 이상)</div>'+
    '<div class="table-wrap"><table><thead><tr><th>#</th><th>종목명</th><th>종목코드</th><th>섹터</th><th class="right">보유주식 수</th><th class="right">지분율</th><th>보고일</th></tr></thead><tbody>'+
    holdings.holdings.sort(function(a,b){return b.ownership_pct-a.ownership_pct;}).map(function(h,i){
      var barW=Math.max(3,h.ownership_pct*8);
      var barColor=SECTOR_COLORS_KR[h.sector]||'#4488ff';
      return'<tr><td class="mono" style="color:var(--t4)">'+(i+1)+'</td><td class="name-cell-kr">'+h.name+'</td><td class="code-cell">'+h.code+'</td><td><span class="sector-badge" style="background:'+barColor+'18;color:'+barColor+'">'+h.sector+'</span></td><td class="mono right">'+fmtShares(h.shares)+'</td><td class="mono right"><span class="pct-bar" style="width:'+barW+'px;background:'+barColor+'"></span>'+fmtPct(h.ownership_pct)+'</td><td class="mono" style="color:var(--t4)">'+h.report_date+'</td></tr>';
    }).join('')+
    '</tbody></table></div>'+
    '<div style="font-size:.6rem;color:var(--t4);margin-top:6px;text-align:center">총 '+holdings.total_count+'개 종목 중 상위 '+holdings.holdings.length+'개 표시 · 지분율 5% 이상 대량보유 보고 기준</div>'+

    '<div id="shareBarWrap"></div>'+
    '<div class="footer">'+
      '데이터 출처: <a href="https://fund.nps.or.kr" target="_blank">국민연금기금운용본부</a> · <a href="https://www.data.go.kr" target="_blank">공공데이터포털</a> · <a href="https://dart.fss.or.kr" target="_blank">DART 전자공시</a><br>'+
      '본 대시보드는 정보 제공 목적이며, 투자 권유가 아닙니다.<br>'+
      'HerdVibe · 기준: '+alloc.period+
    '</div>';

  makeInlineShare(document.getElementById('is1'));
  makeInlineShare(document.getElementById('is2'));
  makeInlineShare(document.getElementById('is3'));
  makeShareBar(document.getElementById('shareBarWrap'));

  /* Allocation Donut */
  new Chart(document.getElementById('allocChart').getContext('2d'),{type:'doughnut',plugins:[wmPlugin],data:{labels:allocKeys.map(function(k){return ALLOC_LABELS[k];}),datasets:[{data:allocKeys.map(function(k){return alloc.allocation[k].amount;}),backgroundColor:allocKeys.map(function(k){return ALLOC_COLORS[k];}),borderWidth:0,hoverOffset:6}]},options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{position:'right',labels:{color:'#8888a0',font:{family:"'Noto Sans KR'",size:10},padding:8,boxWidth:10,boxHeight:10,borderRadius:2,useBorderRadius:true}},tooltip:{backgroundColor:'rgba(10,10,10,.95)',titleFont:{family:"'Noto Sans KR'"},bodyFont:{family:"'JetBrains Mono'",size:11},borderColor:'rgba(255,255,255,.08)',borderWidth:1,callbacks:{label:function(ctx){return' '+ctx.raw+'조 원 ('+(ctx.raw/alloc.total_fund*100).toFixed(1)+'%)';}}}}}});

  /* Stacked Area */
  var months=alloc.monthly_history;
  var stackKeys=['foreign_stock','domestic_stock','domestic_bond','foreign_bond','alternative','short_term'];
  new Chart(document.getElementById('stackedChart').getContext('2d'),{type:'line',plugins:[wmPlugin],data:{labels:months.map(function(m){return m.month.slice(2);}),datasets:stackKeys.map(function(k){return{label:ALLOC_LABELS[k],data:months.map(function(m){return m[k];}),backgroundColor:ALLOC_COLORS[k]+'40',borderColor:ALLOC_COLORS[k],borderWidth:1.5,fill:true,tension:.3,pointRadius:0,pointHoverRadius:4};})},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:'#8888a0',font:{family:"'Noto Sans KR'",size:9},boxWidth:10,boxHeight:3,padding:6}},tooltip:{backgroundColor:'rgba(10,10,10,.95)',titleFont:{family:"'Noto Sans KR'"},bodyFont:{family:"'JetBrains Mono'",size:10},borderColor:'rgba(255,255,255,.08)',borderWidth:1,callbacks:{label:function(ctx){return' '+ALLOC_LABELS[stackKeys[ctx.datasetIndex]]+': '+ctx.raw+'조';}}}},scales:{x:{stacked:true,ticks:{color:'#686880',font:{family:"'JetBrains Mono'",size:8}},grid:{color:'rgba(255,255,255,.03)'}},y:{stacked:true,ticks:{color:'#686880',font:{family:"'JetBrains Mono'",size:9},callback:function(v){return v+'조';}},grid:{color:'rgba(255,255,255,.04)'}}}}});

  /* Growth Bar */
  var yearly=alloc.yearly_total;
  new Chart(document.getElementById('growthChart').getContext('2d'),{type:'bar',plugins:[wmPlugin],data:{labels:yearly.map(function(y){return y.year;}),datasets:[{label:'적립금',data:yearly.map(function(y){return y.total;}),backgroundColor:yearly.map(function(y,i){return i===yearly.length-1?'rgba(6,182,212,.8)':'rgba(68,136,255,.5)';}),borderRadius:4,barThickness:36}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(10,10,10,.95)',bodyFont:{family:"'JetBrains Mono'",size:11},borderColor:'rgba(255,255,255,.08)',borderWidth:1,callbacks:{label:function(ctx){return' '+ctx.raw+'조 원';}}}},scales:{x:{ticks:{color:'#686880',font:{family:"'JetBrains Mono'",size:10}},grid:{display:false}},y:{ticks:{color:'#686880',font:{family:"'JetBrains Mono'",size:9},callback:function(v){return v+'조';}},grid:{color:'rgba(255,255,255,.04)'}}}}});
}

/* iframe resize */
(function(){var lastH=0;setInterval(function(){if(window.parent!==window){var h=document.body.scrollHeight;if(h!==lastH){lastH=h;window.parent.postMessage({type:'resize',height:h},'*');}}},300);})();

init();
</script>
</body>
</html>
