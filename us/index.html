html{font-size:16px;scroll-behavior:smooth;-webkit-font-smoothing:antialiased;overflow-x:hidden}

async function init(){

    var current=await loadJSON('holdings_current.json');
    var history=await loadJSON('holdings_history.json');
    render(current,history);
  }catch(e){
    document.getElementById('app').innerHTML='<div class="loading" style="color:var(--r)">데이터 로드 실패: '+e.message+'</div>';
  }

function render(data,history){
  var app=document.getElementById('app');
  var prev=history.length>=2?history[history.length-2]:null;
  var vDiff=prev?data.total_value-prev.total_value:0;
  var vPct=prev?((vDiff/prev.total_value)*100).toFixed(1):0;

  var sectorMap={};
  data.top50.forEach(function(h){var s=h.sector||'Other';sectorMap[s]=(sectorMap[s]||0)+h.value;});
  var sectorEntries=Object.entries(sectorMap).sort(function(a,b){return b[1]-a[1];});

  var newBuys=data.top50.filter(function(h){return h.status==='new';});
  var movers=data.top50.filter(function(h){return h.status!=='unchanged'&&h.status!=='new';}).sort(function(a,b){return Math.abs(b.change_pct)-Math.abs(a.change_pct);}).slice(0,8);

  app.innerHTML=
    '<div class="summary-grid">'+
      '<div class="summary-card"><div class="label">총 보유 금액</div><div class="value">'+fmt(data.total_value)+'</div><div class="sub '+(vDiff>=0?'pos':'neg')+'">'+(vDiff>=0?'+ ':'- ')+fmt(Math.abs(vDiff))+' ('+(vDiff>=0?'+':'')+vPct+'%)</div></div>'+
      '<div class="summary-card"><div class="label">총 보유 종목</div><div class="value">'+data.total_positions+'</div><div class="sub">Top 50 비중: '+(data.top50_value/data.total_value*100).toFixed(1)+'%</div></div>'+
      '<div class="summary-card"><div class="label">신규 매수</div><div class="value" style="color:var(--g)">'+newBuys.length+'종목</div><div class="sub">'+(newBuys.map(function(h){return h.ticker||h.name.slice(0,8);}).join(', ')||'-')+'</div></div>'+
      '<div class="summary-card"><div class="label">완전 매도</div><div class="value" style="color:var(--r)">'+data.sold_positions.length+'종목</div><div class="sub">'+(data.sold_positions.map(function(h){return h.ticker||h.name.slice(0,8);}).join(', ')||'-')+'</div></div>'+
    '</div>'+
    '<div class="charts-grid">'+
      '<div class="chart-card"><div class="chart-head"><h3>섹터별 비중 (Top 50)</h3></div><div class="chart-area"><canvas id="sectorChart"></canvas></div><div class="inline-share" id="is1"></div></div>'+
      '<div class="chart-card"><div class="chart-head"><h3>분기별 총 보유금액 추이</h3></div><div class="chart-area"><canvas id="historyChart"></canvas></div><div class="inline-share" id="is2"></div></div>'+
    '</div>'+
    '<div class="section-title">분기별 매매 동향</div>'+
    '<div class="trade-grid">'+
      '<div class="trade-card"><h4 style="color:var(--g)">신규 매수</h4>'+(newBuys.length?newBuys.map(function(h){return'<div class="trade-item"><div><span class="trade-ticker">'+(h.ticker||'-')+'</span><span class="trade-name">'+h.name+'</span></div><span class="trade-val buy">'+fmt(h.value)+'</span></div>';}).join(''):'<div style="color:var(--t4);font-size:.7rem;padding:6px 0;text-align:center">해당 없음</div>')+'</div>'+
      '<div class="trade-card"><h4 style="color:var(--r)">완전 매도</h4>'+(data.sold_positions.length?data.sold_positions.map(function(h){return'<div class="trade-item"><div><span class="trade-ticker">'+(h.ticker||'-')+'</span><span class="trade-name">'+h.name+'</span></div><span class="trade-val sell">'+fmt(h.value)+'</span></div>';}).join(''):'<div style="color:var(--t4);font-size:.7rem;padding:6px 0;text-align:center">해당 없음</div>')+'</div>'+
    '</div>'+
    '<div class="bar-section"><h3>주요 비중 변동 종목 (전 분기 대비)</h3><div style="position:relative;height:240px"><canvas id="moversChart"></canvas></div></div>'+
    '<div class="section-title">Top 50 보유 종목</div>'+
    '<div class="table-wrap"><table><thead><tr><th>#</th><th>티커</th><th>종목명</th><th>섹터</th><th class="right">보유주식</th><th class="right">시장가치</th><th class="right">비중</th><th class="right">변동</th></tr></thead><tbody>'+
    data.top50.map(function(h){
      var badge='';
      if(h.status==='new')badge='<span class="badge badge-new">NEW</span>';
      else if(h.status==='increased')badge='<span class="badge badge-up">+'+h.change_pct+'%</span>';
      else if(h.status==='decreased')badge='<span class="badge badge-down">'+h.change_pct+'%</span>';
      else badge='<span class="badge badge-flat">-</span>';
      var barW=Math.max(2,h.weight*12);
      return'<tr><td class="rank-cell">'+h.rank+'</td><td class="ticker-cell">'+(h.ticker||'-')+'</td><td class="name-cell">'+h.name+'</td><td class="sector-cell">'+h.sector+'</td><td class="mono-cell right">'+fmtShares(h.shares)+'</td><td class="mono-cell right">'+fmt(h.value)+'</td><td class="mono-cell right"><span class="weight-bar" style="width:'+barW+'px"></span>'+h.weight+'%</td><td class="right">'+badge+'</td></tr>';
    }).join('')+
    '</tbody></table></div>'+
    '<div id="shareBarWrap"></div>'+
    '<div class="footer">'+
      '데이터 출처: <a href="https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001608046&type=13F" target="_blank">SEC EDGAR</a> 13F Filing (CIK: 0001608046)<br>'+
      '본 대시보드는 정보 제공 목적이며, 투자 권유가 아닙니다.<br>'+
      'HerdVibe · Filing: '+data.filing_date+' · Period: '+periodLabel(data.period)+
    '</div>';

  makeInlineShare(document.getElementById('is1'));
  makeInlineShare(document.getElementById('is2'));
  makeShareBar(document.getElementById('shareBarWrap'));

  /* Sector Donut */
  new Chart(document.getElementById('sectorChart').getContext('2d'),{type:'doughnut',plugins:[wmPlugin],data:{labels:sectorEntries.map(function(e){return e[0];}),datasets:[{data:sectorEntries.map(function(e){return e[1];}),backgroundColor:sectorEntries.map(function(e){return SECTOR_COLORS[e[0]]||'#475569';}),borderWidth:0,hoverOffset:6}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'right',labels:{color:'#8888a0',font:{family:"'Noto Sans KR'",size:10},padding:8,boxWidth:10,boxHeight:10,borderRadius:2,useBorderRadius:true}},tooltip:{backgroundColor:'rgba(10,10,10,.95)',titleFont:{family:"'Noto Sans KR'"},bodyFont:{family:"'JetBrains Mono'",size:11},borderColor:'rgba(255,255,255,.08)',borderWidth:1,callbacks:{label:function(ctx){var val=ctx.raw;var total=ctx.dataset.data.reduce(function(a,b){return a+b;},0);return' '+fmt(val)+' ('+(val/total*100).toFixed(1)+'%)';}}}}}});

  /* History Line */
  new Chart(document.getElementById('historyChart').getContext('2d'),{type:'line',plugins:[wmPlugin],data:{labels:history.map(function(h){return periodLabel(h.period);}),datasets:[{label:'총 보유금액',data:history.map(function(h){return h.total_value/1e9;}),borderColor:'#4488ff',backgroundColor:'rgba(68,136,255,.08)',fill:true,tension:.3,pointRadius:3,pointBackgroundColor:'#4488ff',pointBorderColor:'#000',pointBorderWidth:2},{label:'종목 수',data:history.map(function(h){return h.total_positions;}),borderColor:'#8b5cf6',borderDash:[4,4],tension:.3,pointRadius:2,pointBackgroundColor:'#8b5cf6',yAxisID:'y1'}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:'#8888a0',font:{family:"'Noto Sans KR'",size:10},boxWidth:14,boxHeight:2}},tooltip:{backgroundColor:'rgba(10,10,10,.95)',titleFont:{family:"'Noto Sans KR'"},bodyFont:{family:"'JetBrains Mono'",size:11},borderColor:'rgba(255,255,255,.08)',borderWidth:1,callbacks:{label:function(ctx){if(ctx.datasetIndex===0)return' $'+ctx.raw.toFixed(1)+'B';return' '+ctx.raw+' 종목';}}}},scales:{x:{ticks:{color:'#686880',font:{family:"'JetBrains Mono'",size:9}},grid:{color:'rgba(255,255,255,.03)'}},y:{position:'left',ticks:{color:'#686880',font:{family:"'JetBrains Mono'",size:9},callback:function(v){return'$'+v+'B';}},grid:{color:'rgba(255,255,255,.04)'}},y1:{position:'right',ticks:{color:'#686880',font:{family:"'JetBrains Mono'",size:9}},grid:{drawOnChartArea:false}}}}});

  /* Movers Bar */
  var ms=movers.sort(function(a,b){return b.change_pct-a.change_pct;});
  new Chart(document.getElementById('moversChart').getContext('2d'),{type:'bar',plugins:[wmPlugin],data:{labels:ms.map(function(h){return h.ticker||h.name.slice(0,8);}),datasets:[{data:ms.map(function(h){return h.change_pct;}),backgroundColor:ms.map(function(h){return h.change_pct>=0?'rgba(0,255,136,.6)':'rgba(255,68,102,.6)';}),borderRadius:4,barThickness:24}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(10,10,10,.95)',bodyFont:{family:"'JetBrains Mono'",size:11},borderColor:'rgba(255,255,255,.08)',borderWidth:1,callbacks:{label:function(ctx){return' '+(ctx.raw>0?'+':'')+ctx.raw+'%';}}}},scales:{x:{ticks:{color:'#686880',font:{family:"'JetBrains Mono'",size:9},callback:function(v){return v+'%';}},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'#4488ff',font:{family:"'JetBrains Mono'",size:11,weight:600}},grid:{display:false}}}}});
}

/* iframe resize */
(function(){var lastH=0;setInterval(function(){if(window.parent!==window){var h=document.body.scrollHeight;if(h!==lastH){lastH=h;window.parent.postMessage({type:'resize',height:h},'*');}}},300);})();

init();
</script>
</body>
